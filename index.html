<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小役カウンター">
<meta name="theme-color" content="#111318">
<title>小役カウンター</title>
<style>
  :root{
    --bg:#111318; --panel:#1b1e25; --tile:#262b35; --tile-on:#3a4252;
    --text:#eef0f4; --sub:#9aa3b2; --line:#2e3440;
    --red:#e5484d; --green:#30a46c; --yellow:#f5d90a; --blue:#3e8ef7; --purple:#8e4ec6; --orange:#f76b15;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
  body{
    height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right))
            max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  }

  /* ---------- 上部バー（1行） ---------- */
  header{display:flex;gap:5px;align-items:stretch;height:38px;flex:none;margin-bottom:5px}
  .tab{border:none;border-radius:8px;background:var(--panel);color:var(--sub);font-size:13px;font-weight:700;padding:0 12px;white-space:nowrap}
  .tab.on{background:var(--blue);color:#fff}
  .gbox{display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:8px;padding:0 8px;min-width:0;flex:1}
  .gbox label{font-size:10px;color:var(--sub);white-space:nowrap}
  .gbox input,.gbox .val{width:100%;min-width:0;background:transparent;border:none;color:var(--text);
    font-size:18px;font-weight:700;padding:0;outline:none;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
  .tool{border:none;border-radius:8px;background:var(--panel);color:var(--text);font-size:12px;font-weight:700;padding:0 10px;white-space:nowrap}
  .tool:disabled{opacity:.35}
  .tool.warn{color:#ff8b8b}
  .armed{background:var(--red)!important;color:#fff!important}

  /* ---------- 本体：グループを横並び ---------- */
  main{flex:1;min-height:0;display:flex;gap:5px}
  .group{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;
    background:var(--panel);border-radius:10px;padding:5px;border-top:3px solid var(--c,var(--blue))}
  .gtitle{font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
  .tiles{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
  .tile{position:relative;flex:1;min-height:0;border:none;border-radius:8px;background:var(--tile);color:var(--text);
    padding:4px 6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;
    transition:background .06s,transform .06s;overflow:hidden}
  .tile:active{background:var(--tile-on);transform:scale(.97)}
  .tile .lbl{font-size:11px;color:var(--sub);font-weight:600;line-height:1.2}
  .tile .num{font-size:clamp(22px,11vh,56px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .minus{position:absolute;right:3px;bottom:3px;width:34px;height:30px;border-radius:6px;
    background:rgba(255,255,255,.09);color:var(--sub);font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center}
  .stats{flex:none;display:flex;flex-wrap:wrap;column-gap:10px;font-size:10px;color:var(--sub);line-height:1.35}
  .stats b{color:var(--text);font-size:12px;font-variant-numeric:tabular-nums}
  .log{flex:none;font-size:10px;color:var(--sub);line-height:1.35;background:rgba(255,255,255,.04);border-radius:6px;padding:3px 6px}
  .log b{color:var(--text);font-size:12px;font-variant-numeric:tabular-nums}
  .log .row{display:flex;gap:6px}
  .log .recent{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .log .times{flex:none;color:var(--text);font-weight:700}
  .reset{flex:none;border:none;border-radius:6px;background:var(--tile);color:var(--sub);font-size:10px;font-weight:700;padding:7px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ref{flex:none;display:flex;align-items:baseline;gap:4px;font-size:10px;color:var(--sub);line-height:1.35;white-space:nowrap;overflow:hidden}
  .ref b{color:#ffd76a;font-size:12px;font-variant-numeric:tabular-nums}
  .ref .more{margin-left:auto;font-size:10px;color:var(--blue)}

  /* ---------- 参考値の表 ---------- */
  .overlay{position:fixed;inset:0;z-index:30;background:#000a;display:none;align-items:center;justify-content:center;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  .overlay.show{display:flex}
  .sheet{background:var(--panel);border-radius:12px;padding:10px;max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:6px}
  .sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
  .sheet-head span,.note{font-size:10px;color:var(--sub)}
  .tbl-wrap{overflow:auto;min-height:0}
  table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  th,td{padding:5px 7px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
  thead th{color:var(--sub);font-weight:600;font-size:11px}
  tbody th{text-align:left;font-weight:700}
  tbody th small{display:block;font-size:9px;color:var(--sub);font-weight:500}
  td.cur{color:#ffd76a;font-weight:700}
  td.near{outline:2px solid var(--blue);outline-offset:-2px;border-radius:4px;font-weight:700}

  /* ---------- 縦向き時：縦スクロールで2列 ---------- */
  @media (orientation: portrait){
    html,body{overflow:auto}
    body{height:auto;min-height:100dvh}
    header{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:auto;margin-bottom:8px}
    header .tab{grid-column:span 3;height:44px;font-size:15px}
    header .gbox{grid-column:span 2;height:48px;flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
    header .gbox input,header .gbox .val{font-size:20px}
    header .tool{grid-column:span 2;height:44px;font-size:14px}
    main{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
    .group{padding:7px;gap:6px}
    .gtitle{font-size:13px}
    .tiles{flex:none;gap:6px}
    .tile{flex:none;height:96px;padding:6px 8px}
    .tile .lbl{font-size:12px}
    .tile .num{font-size:38px}
    .minus{width:46px;height:40px;right:4px;bottom:4px;font-size:20px;border-radius:8px}
    .stats,.ref{font-size:11px}
    .reset{padding:12px 4px;font-size:12px}
  }

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);
    background:#000d;color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <span id="tabs" style="display:contents"></span>
  <div class="gbox"><label>開始G</label><input id="startG" type="number" inputmode="numeric" placeholder="0"></div>
  <div class="gbox"><label>現在G</label><input id="curG" type="number" inputmode="numeric" placeholder="0"></div>
  <div class="gbox"><label>消化G</label><div class="val" id="playedG">0</div></div>
  <button class="tool" data-ref>参考値</button>
  <button class="tool" id="undoBtn">↶ 戻す</button>
  <button class="tool warn" id="clearBtn">全リセット</button>
</header>
<main id="main"></main>
<div class="overlay" id="refOverlay"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   機種設定 — ここを書き換えればカスタマイズできます
   short : タブに表示する短い名前
   items : カウントするボタン（id は機種内で重複しないこと）
   reset : グループ単位のリセットボタン（CZ当選など）
   stats : 表示する計算値
     prob  … 消化G ÷ 回数 → 1/x 表示
     rate  … num ÷ den → %（例：当選数 ÷ 回数）
     share … a ÷ (a + b) → %（例：発光 ÷ (発光+非発光)）
     points… a×aPt + b×bPt → 「X/maxpt」表示
             carry を指定すると、リセット時に max を超えた分を繰り越す
             log を指定すると、リセット時のポイント（最大 max）を履歴に残し平均を表示
     ref     … 設定1〜6の参考値（%、不明は null）。グループ内に「設6」を表示し、
               「参考」ボタンで全設定の表を表示
     refText … 参考値の表示を % 以外にしたいとき（例：'1/8'）
     frac    … rate を % に加えて 1/x でも表示
   color : グループ上端の色
   ========================================================= */
const MACHINES = [
  {
    id: 'kabaneri', short: 'カバネリ',
    groups: [
      { title: '帯無し 赤緑チャンス目', color: 'var(--yellow)',
        items: [ {id:'obiTotal', label:'総数'}, {id:'obiFlash', label:'発光'} ],
        stats: [ {type:'rate', label:'発光率', num:'obiFlash', den:'obiTotal', frac:true,
                  ref:[12.5,null,null,null,null,16.67], refText:['1/8','','','','','1/6']} ] },
      { title: '無名チャンス目', color: 'var(--red)',
        reset: { label: '無名CZ当選 リセット' },
        items: [ {id:'redOn', label:'発光'}, {id:'redOff', label:'非発光'} ],
        stats: [ {type:'share', label:'発光率', a:'redOn', b:'redOff'},
                 {type:'points', label:'', a:'redOn', aPt:10, b:'redOff', bPt:1, max:100, carry:'redCarry', log:'redLog'} ] },
      { title: '生駒チャンス目', color: 'var(--green)',
        reset: { label: '生駒CZ当選 リセット' },
        items: [ {id:'grnOn', label:'発光'}, {id:'grnOff', label:'非発光'} ],
        stats: [ {type:'share', label:'発光率', a:'grnOn', b:'grnOff'},
                 {type:'points', label:'', a:'grnOn', aPt:10, b:'grnOff', bPt:1, max:100, carry:'grnCarry', log:'grnLog'} ] },
      { title: '下段ベル', color: 'var(--blue)',
        items: [ {id:'lowBell', label:'下段ベル'} ],
        stats: [ {type:'prob', label:'確率', num:'lowBell'} ] },
    ]
  },
  {
    id: 'bofuri', short: '防振り',
    groups: [
      { title: 'ヒドラ目(通常)', color: 'var(--purple)',
        items: [ {id:'hydra', label:'ヒドラ目'}, {id:'hydraWin', label:'高確当選'} ],
        stats: [ {type:'rate', label:'当選率', num:'hydraWin', den:'hydra',
                  ref:[25,25,25,30.3,31.7,33.3], refText:['1/4','1/4','1/4','1/3.3','31.7%','1/3']} ] },
      { title: '上段ベル・直撃', color: 'var(--blue)',
        items: [ {id:'topBell', label:'上段ベル'}, {id:'direct', label:'直撃'} ],
        stats: [ {type:'prob', label:'ベル', num:'topBell'}, {type:'prob', label:'直撃', num:'direct'} ] },
      { title: '夕方レア役', color: 'var(--orange)',
        items: [ {id:'evRare', label:'レア役'}, {id:'evRareWin', label:'高確当選'} ],
        stats: [ {type:'rate', label:'当選率', num:'evRareWin', den:'evRare',
                  ref:[3.8,6.3,6.3,8.3,8.6,9.2]} ] },
      { title: '夕方ヒドラ目', color: 'var(--purple)',
        items: [ {id:'evHydra', label:'ヒドラ目'}, {id:'evHydraWin', label:'高確当選'} ],
        stats: [ {type:'rate', label:'当選率', num:'evHydraWin', den:'evHydra',
                  ref:[50,50,50,55,55,60]} ] },
      { title: '初当たり', color: 'var(--red)',
        items: [ {id:'first', label:'初当たり'}, {id:'firstBet', label:'ベット高確'} ],
        stats: [ {type:'rate', label:'当選率', num:'firstBet', den:'first'}, {type:'prob', label:'初当り', num:'first'} ] },
      { title: '300G', color: 'var(--green)',
        items: [ {id:'g300', label:'踏んだ'}, {id:'g300Win', label:'高確当選'} ],
        stats: [ {type:'rate', label:'当選率', num:'g300Win', den:'g300',
                  ref:[40,42.1,42.1,47.5,48.8,50]} ] },
      { title: '450G', color: 'var(--green)',
        items: [ {id:'g450', label:'踏んだ'}, {id:'g450Win', label:'高確当選'} ],
        stats: [ {type:'rate', label:'当選率', num:'g450Win', den:'g450',
                  ref:[18.3,20,20,25.8,29.2,30.4]} ] },
      { title: '650G', color: 'var(--green)',
        items: [ {id:'g650', label:'踏んだ'}, {id:'g650Win', label:'高確当選'} ],
        stats: [ {type:'rate', label:'当選率', num:'g650Win', den:'g650',
                  ref:[10,10,10,17.9,19.2,23.3]} ] },
    ]
  }
];

/* ================= 保存 ================= */
const KEY = 'slotCounter.v1';
let state = load();
function blank(){
  const s = { active: MACHINES[0].id, data: {} };
  MACHINES.forEach(m => s.data[m.id] = { counts:{}, logs:{}, startG:'', curG:'', history:[] });
  return s;
}
function load(){
  let s = blank();
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved && saved.data){
        s.active = saved.active || s.active;
        MACHINES.forEach(m => { if(saved.data[m.id]) s.data[m.id] = Object.assign(s.data[m.id], saved.data[m.id]); });
      }
    }
  }catch(e){}
  if(!MACHINES.find(m => m.id === s.active)) s.active = MACHINES[0].id;
  MACHINES.forEach(m => { if(!s.data[m.id].logs) s.data[m.id].logs = {}; });
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ================= 計算 ================= */
const machine = () => MACHINES.find(m => m.id === state.active);
const D = () => state.data[state.active];
const cnt = id => D().counts[id] || 0;
const logOf = key => D().logs[key] || [];
function played(){
  const s = parseInt(D().startG, 10) || 0, c = parseInt(D().curG, 10) || 0;
  return Math.max(0, c - s);
}
/* ポイント = 前回リセット時の繰り越し + a×aPt + b×bPt */
function points(st){
  return (st.carry ? cnt(st.carry) : 0) + cnt(st.a) * st.aPt + cnt(st.b) * st.bPt;
}
function statText(st){
  if(st.type === 'prob'){
    const n = cnt(st.num), g = played();
    return n > 0 && g > 0 ? '1/' + (g / n).toFixed(1) : '—';
  }
  if(st.type === 'rate'){
    const n = cnt(st.num), d = cnt(st.den);
    if(d === 0) return '—';
    const pct = (n / d * 100).toFixed(1) + '%';
    return st.frac && n > 0 ? `${pct} (1/${(d / n).toFixed(1)})` : pct;
  }
  if(st.type === 'share'){
    const a = cnt(st.a), b = cnt(st.b), t = a + b;
    return t > 0 ? (a / t * 100).toFixed(1) + '%' + ` (${a}/${t})` : '—';
  }
  if(st.type === 'points') return `${points(st)}/${st.max}pt`;
  return '';
}

/* ================= 操作 ================= */
function pushHistory(entry){
  const h = D().history; h.push(entry); if(h.length > 200) h.shift();
}
function change(id, delta){
  const before = cnt(id), after = Math.max(0, before + delta);
  if(before === after) return;
  pushHistory({ values:{ [id]: before } });
  D().counts[id] = after;
  save(); render();
}
function resetGroup(g){
  const values = {};
  g.items.forEach(it => values[it.id] = cnt(it.id));
  /* ポイントが上限を超えていたら、上限分だけ引いて残りを繰り越す */
  const carries = [], logs = {};
  (g.stats || []).filter(st => st.type === 'points').forEach(st => {
    const pt = points(st);
    if(st.carry){
      values[st.carry] = cnt(st.carry);
      carries.push([st.carry, Math.max(0, pt - st.max)]);
    }
    if(st.log){
      logs[st.log] = logOf(st.log).slice();               // 戻す用に控える
      D().logs[st.log] = logOf(st.log).concat(Math.min(pt, st.max));
    }
  });
  pushHistory({ values, logs });
  g.items.forEach(it => D().counts[it.id] = 0);
  carries.forEach(([k, v]) => D().counts[k] = v);
  const left = carries.reduce((s, [, v]) => s + v, 0);
  save(); render(); toast(g.title + ' をリセット' + (left > 0 ? `（${left}pt 繰り越し）` : ''));
}
function undo(){
  const e = D().history.pop();
  if(!e) return;
  Object.entries(e.values).forEach(([k, v]) => D().counts[k] = v);
  if(e.logs) Object.entries(e.logs).forEach(([k, v]) => D().logs[k] = v);
  save(); render(); toast('元に戻しました');
}
function clearAll(){
  state.data[state.active] = { counts:{}, logs:{}, startG:'', curG:'', history:[] };
  save(); render(); toast('全てリセットしました');
}

/* 2回タップで確定（誤操作防止） */
function armed(btn, original, action){
  if(btn.classList.contains('armed')){
    clearTimeout(btn._t); btn.classList.remove('armed'); btn.textContent = original; action();
    return;
  }
  btn.classList.add('armed'); btn.textContent = 'もう一度';
  btn._t = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = original; }, 2500);
}

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1200);
}

/* ================= 参考値 ================= */
function refLabel(st, i){
  if(st.refText && st.refText[i]) return st.refText[i];
  return st.ref[i] == null ? '—' : st.ref[i] + '%';
}
function currentPct(st){
  if(st.type === 'rate'){ const d = cnt(st.den); return d ? cnt(st.num) / d * 100 : null; }
  if(st.type === 'share'){ const t = cnt(st.a) + cnt(st.b); return t ? cnt(st.a) / t * 100 : null; }
  return null;
}
function openRef(){
  const rows = [];
  machine().groups.forEach(g => (g.stats || []).filter(st => st.ref).forEach(st => {
    const cur = currentPct(st);
    // 現在値に一番近い設定に印を付ける（同値は全部）
    let near = [];
    if(cur !== null){
      const diffs = st.ref.map(v => v == null ? Infinity : Math.abs(v - cur));
      const min = Math.min(...diffs);
      near = diffs.map(d => d === min && d !== Infinity);
    }
    rows.push(`<tr><th>${g.title}<small>${st.label}</small></th>
      <td class="cur">${cur === null ? '—' : cur.toFixed(1) + '%'}</td>
      ${st.ref.map((v, i) => `<td class="${near[i] ? 'near' : ''}">${refLabel(st, i)}</td>`).join('')}</tr>`);
  }));
  const ov = document.getElementById('refOverlay');
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-head"><b>${machine().short} 設定別参考値</b><span>タップで閉じる</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th></th><th>現在</th>${[1,2,3,4,5,6].map(n => `<th>設${n}</th>`).join('')}</tr></thead>
      <tbody>${rows.join('') || '<tr><td colspan="8">参考値が登録されていません</td></tr>'}</tbody>
    </table></div>
    <div class="note">枠付き＝現在値に最も近い設定</div>
  </div>`;
  ov.classList.add('show');
}
function closeRef(){ document.getElementById('refOverlay').classList.remove('show'); }

/* ================= 描画 ================= */
function logHtml(st){
  const L = logOf(st.log);
  const avgNum = L.length ? L.reduce((a, b) => a + b, 0) / L.length : null;
  const avg = avgNum === null ? '—' : avgNum.toFixed(1) + 'pt';
  const per15 = avgNum === null ? '—' : (avgNum / st.aPt).toFixed(2) + '回発光';   // 平均ポイント ÷ 発光1回のポイント
  const recent = L.slice(-8).reverse().join(' / ');          // 新しい順に最大8件
  return `<div class="log">
    <div>リセット時平均 <b>${avg}</b> (${per15})</div>
    <div class="row"><span class="recent">${recent || '履歴なし'}</span><span class="times">${L.length}回</span></div>
  </div>`;
}
function render(){
  const m = machine();
  document.getElementById('tabs').innerHTML = MACHINES.map(x =>
    `<button class="tab ${x.id === state.active ? 'on' : ''}" data-tab="${x.id}">${x.short}</button>`).join('');
  const sg = document.getElementById('startG'), cg = document.getElementById('curG');
  if(document.activeElement !== sg) sg.value = D().startG;
  if(document.activeElement !== cg) cg.value = D().curG;
  document.getElementById('playedG').textContent = played();
  document.getElementById('undoBtn').disabled = D().history.length === 0;

  document.getElementById('main').innerHTML = m.groups.map((g, gi) => `
    <section class="group" style="--c:${g.color || 'var(--blue)'}">
      <div class="gtitle">${g.title}</div>
      <div class="tiles">
        ${g.items.map(it => `
          <button class="tile" data-inc="${it.id}">
            <span class="lbl">${it.label}</span>
            <span class="num">${cnt(it.id)}</span>
            <span class="minus" data-dec="${it.id}" role="button" aria-label="${it.label}を1減らす">−</span>
          </button>`).join('')}
      </div>
      ${g.stats && g.stats.length ? `<div class="stats">${g.stats.map(st =>
        `<div>${st.label ? st.label + ' ' : ''}<b>${statText(st)}</b></div>`).join('')}</div>` : ''}
      ${(g.stats || []).filter(st => st.ref).map(st =>
        `<div class="ref" data-ref>設6 <b>${refLabel(st, 5)}</b><span class="more">›</span></div>`).join('')}
      ${(g.stats || []).filter(st => st.log).map(st => logHtml(st)).join('')}
      ${g.reset ? `<button class="reset" data-reset="${gi}">${g.reset.label}</button>` : ''}
    </section>`).join('');
}

/* ================= イベント ================= */
document.addEventListener('click', e => {
  if(e.target.closest('#refOverlay')){ closeRef(); return; }
  if(e.target.closest('[data-ref]')){ openRef(); return; }
  const tab = e.target.closest('[data-tab]');
  if(tab){ state.active = tab.dataset.tab; save(); render(); return; }
  const dec = e.target.closest('[data-dec]');
  if(dec){ change(dec.dataset.dec, -1); return; }
  const inc = e.target.closest('[data-inc]');
  if(inc){ change(inc.dataset.inc, +1); return; }
  const rs = e.target.closest('[data-reset]');
  if(rs){ const g = machine().groups[+rs.dataset.reset]; armed(rs, g.reset.label, () => resetGroup(g)); return; }
});
document.getElementById('undoBtn').addEventListener('click', undo);
const clearBtn = document.getElementById('clearBtn');
clearBtn.addEventListener('click', () => armed(clearBtn, '全リセット', clearAll));
['startG','curG'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => { D()[id] = el.value; save(); render(); });
  el.addEventListener('keydown', e => { if(e.key === 'Enter') el.blur(); });
});
/* ダブルタップ拡大を防止 */
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTouch < 300 && !e.target.closest('input')) e.preventDefault();
  lastTouch = now;
}, { passive:false });

render();

/* オフライン対応（sw.js を同じ場所に置いておく） */
if('serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}
}
</script>
